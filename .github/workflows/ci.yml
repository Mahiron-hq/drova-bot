name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: No unsafe and no OpenSSL
        run: |
          if grep -rnw "unsafe" src --include=*.rs; then exit 1; fi
          for c in openssl-sys native-tls aws-lc-sys; do
            if cargo tree --locked -e normal -i "$c" >/dev/null 2>&1; then echo "$c found"; exit 1; fi
          done
      - name: No em dash
        run: |
          if grep -rn "$(printf '\342\200\224')" src migrations deploy README.md PRIVACY.md CHANGELOG.md SECURITY.md; then exit 1; fi

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --locked

  build:
    runs-on: ubuntu-24.04
    needs: [check, deny]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and zig
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          pip install ziglang==0.17.1
          cargo install cargo-zigbuild --locked --version 0.24.1
      - name: Build
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/drova-bot dist/
          file dist/drova-bot
          ./dist/drova-bot --version
          ./dist/drova-bot --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drova-bot-linux-x86_64
          path: dist/drova-bot
          retention-days: 14
