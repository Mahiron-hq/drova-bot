name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the version and is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, version $version"
          test "$tag" = "$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and zig
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          pip install ziglang==0.17.1
          cargo install cargo-zigbuild --locked --version 0.24.1
          cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Build and package
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          name="drova-bot-${version}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-musl/release/drova-bot "dist/$name/"
          cp LICENSE README.md CHANGELOG.md PRIVACY.md "dist/$name/"
          cargo about generate --locked about.hbs -o "dist/$name/THIRD-PARTY.txt"
          cp -r deploy "dist/$name/deploy"
          tar -C dist -czf "dist/$name.tar.gz" --owner=0 --group=0 --numeric-owner "$name"
          cd dist
          sha256sum "$name.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 30
